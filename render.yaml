# One-click deploy on Render: New → Blueprint → pick this repo.
# Creates a free Postgres database and a web service wired to it.
services:
  - type: web
    name: campus-lost-and-found
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload --workers 2 --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lostandfound-db
          property: connectionString

databases:
  - name: lostandfound-db
    plan: free
