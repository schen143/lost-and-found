{% extends "base.html" %}
{% block title %}Sign in · Campus Lost &amp; Found{% endblock %}

{% block content %}
<div class="panel narrow">
  <h1>Sign in</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" required autocomplete="username" value="{{ username }}" autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <label class="checkbox"><input type="checkbox" name="remember" value="1" checked> Keep me signed in</label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="meta">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
  {% if config.SHOW_DEMO_HINT %}
    <p class="hint">Just looking around? Sign in as <code>maya_r</code> with password <code>lostandfound</code>.</p>
  {% endif %}
</div>
{% endblock %}
